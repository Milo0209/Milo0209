name: Update stats

# Only a schedule and a manual trigger. No pull_request / pull_request_target,
# so nobody else can ever run this with access to the secrets.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  # Job 1 holds the read-only token for private repos but has NO write access.
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Count lines of code (prints sums only)
        env:
          STATS_GITHUB_TOKEN: ${{ secrets.STATS_GITHUB_TOKEN }}
          STATS_AUTHOR_EMAILS: ${{ secrets.STATS_AUTHOR_EMAILS }}
        run: python3 -I scripts/loc.py

      - name: Safety gate
        env:
          STATS_DENYLIST: ${{ secrets.STATS_DENYLIST }}
        run: python3 -I scripts/validate.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loc
          path: |
            data/loc.json
            assets/loc.svg
            assets/languages.svg
            assets/activity.svg
          retention-days: 1
          if-no-files-found: error

  # Job 2 may write to the repo but never sees the personal access token.
  commit:
    needs: compute
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loc

      - name: Safety gate
        env:
          STATS_DENYLIST: ${{ secrets.STATS_DENYLIST }}
        run: python3 -I scripts/validate.py

      - name: Commit and push (only the four stats files)
        run: |
          set -eu
          for f in $(git status --porcelain | awk '{print $2}'); do
            case "$f" in
              data/loc.json|assets/loc.svg|assets/languages.svg|assets/activity.svg) ;;
              *) echo "unexpected change in working tree - aborting"; exit 1 ;;
            esac
          done
          if [ -z "$(git status --porcelain)" ]; then echo "no changes"; exit 0; fi
          git config user.name "Milo0209"
          git config user.email "217570049+Milo0209@users.noreply.github.com"
          git add data/loc.json assets/loc.svg assets/languages.svg assets/activity.svg
          git commit -m "chore: update lines-of-code stats"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          echo "push failed"; exit 1
