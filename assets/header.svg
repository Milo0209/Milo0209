<svg xmlns="http://www.w3.org/2000/svg" width="990" height="230" viewBox="0 0 990 230" role="img" aria-label="Emilio – Computer Science student. Data Science, AI, Cyber Security.">
<title>Emilio – Computer Science student</title>
<style>
:root {
  --bg:#f6f8fa; --border:#d0d7de; --title:#3b6fd4; --num:#0f8f7f; --text:#57606a;
  --muted:#8c959f; --accent:#8250df; --line:#3b6fd4; --grid:#d8dee4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#1a1b27; --border:#2a2d42; --title:#70a5fd; --num:#38bdae; --text:#a9b1d6;
    --muted:#6b7394; --accent:#bf91f3; --line:#70a5fd; --grid:#2a2d42;
  }
}

text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
.card { fill: var(--bg); stroke: var(--border); stroke-width: 1; }
.title { font-size: 15px; font-weight: 600; fill: var(--title); }
.big { font-size: 36px; font-weight: 700; fill: var(--num); }
.lbl { font-size: 12px; fill: var(--text); }
.val { font-size: 12px; font-weight: 600; fill: var(--text); }
.tiny { font-size: 10px; fill: var(--muted); }
.spark { fill: none; stroke: var(--line); stroke-width: 2; stroke-linejoin: round;
         stroke-linecap: round; stroke-dasharray: 1000; stroke-dashoffset: 1000;
         animation: draw 1.6s ease-out forwards; }
.area { fill: url(#g); opacity: 0; animation: fade 1.2s ease-out .5s forwards; }
.dot { fill: var(--accent); opacity: 0; animation: fade .4s ease-out 1.6s forwards; }
.grid { stroke: var(--grid); stroke-width: 1; }
.grade { animation: grade 20s ease-in-out infinite; }
.blob { animation: drift 14s ease-in-out infinite alternate; }
.blob2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
@keyframes grade { 0%, 100% { filter: hue-rotate(-40deg); } 50% { filter: hue-rotate(45deg); } }
@keyframes drift { to { transform: translate(60px, 18px); } }
.seg { transform-box: fill-box; transform-origin: 0 50%;
       animation: grow .9s cubic-bezier(.2,.8,.2,1) backwards; }
.leg { animation: rise .6s ease-out backwards; }
.shine { fill: url(#sh); transform-box: fill-box; animation: sweep 1.5s ease-in-out 1.5s backwards; }
@keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1100px); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .spark { animation: none; stroke-dashoffset: 0; }
  .area, .dot { animation: none; opacity: 1; }
  .seg, .leg, .shine, .grade, .blob, .blob2 { animation: none; }
}
</style>
<style>
.cursor { animation: blink 1s steps(1) infinite; }
.name { fill: url(#tg); font-size: 54px; font-weight: 800; letter-spacing: -1px; }
.sub { font-size: 17px; fill: var(--text); }
.tag { font-size: 13px; fill: var(--muted); }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
<defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--title)"/><stop offset="1" style="stop-color:var(--num)"/></linearGradient></defs>
<rect class="card" x=".5" y=".5" width="989" height="229" rx="12" style="stroke:none"/><defs><clipPath id="hc"><rect width="990" height="230" rx="12"/></clipPath><radialGradient id="b1"><stop offset="0" style="stop-color:var(--title)" stop-opacity=".30"/><stop offset="1" style="stop-color:var(--title)" stop-opacity="0"/></radialGradient><radialGradient id="b2"><stop offset="0" style="stop-color:var(--accent)" stop-opacity=".26"/><stop offset="1" style="stop-color:var(--accent)" stop-opacity="0"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" style="fill:var(--grid)"/></pattern></defs><g clip-path="url(#hc)"><rect width="990" height="230" fill="url(#dots)"/><g class="grade"><circle class="blob" cx="168" cy="34" r="230" fill="url(#b1)"/><circle class="blob2" cx="812" cy="218" r="238" fill="url(#b2)"/></g></g><rect class="card" x=".5" y=".5" width="989" height="229" rx="12" style="fill:none"/>
<text class="tag" x="42" y="52">Hi, I'm</text>
<g class="grade"><text class="name leg" x="38" y="104" style="animation-delay:.1s">Emilio</text></g>
<text class="sub leg" x="42" y="134" style="animation-delay:.4s">Computer Science student @ Fontys Venlo</text>
<text class="tag leg" x="42" y="156" style="animation-delay:.6s">I build systems that run 24/7 and learn from their own data.</text>
<g class="leg" style="animation-delay:0.90s"><rect x="40" y="172" width="118" height="28" rx="14" fill="#3b82f6" fill-opacity=".14" stroke="#3b82f6" stroke-opacity=".55"/><circle cx="54" cy="186" r="3.5" fill="#3b82f6"/><text class="lbl" x="64" y="190" style="font-size:12px;font-weight:600">Data Science</text></g><g class="leg" style="animation-delay:1.02s"><rect x="170" y="172" width="52" height="28" rx="14" fill="#a371f7" fill-opacity=".14" stroke="#a371f7" stroke-opacity=".55"/><circle cx="184" cy="186" r="3.5" fill="#a371f7"/><text class="lbl" x="194" y="190" style="font-size:12px;font-weight:600">AI</text></g><g class="leg" style="animation-delay:1.14s"><rect x="234" y="172" width="128" height="28" rx="14" fill="#2dd4bf" fill-opacity=".14" stroke="#2dd4bf" stroke-opacity=".55"/><circle cx="248" cy="186" r="3.5" fill="#2dd4bf"/><text class="lbl" x="258" y="190" style="font-size:12px;font-weight:600">Cyber Security</text></g>
<rect x="570" y="38" width="380" height="172" rx="10" class="card" style="fill:var(--bg);fill-opacity:.72"/>
<circle cx="590" cy="56" r="4.5" fill="#f85149"/><circle cx="606" cy="56" r="4.5" fill="#f0b429"/><circle cx="622" cy="56" r="4.5" fill="#56d364"/>
<line class="grid" x1="570" y1="72" x2="950" y2="72"/>
<text class="leg" x="600" y="96" style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13px;fill:var(--text);animation-delay:0.4s"><tspan style="fill:var(--accent)">$</tspan> whoami</text><text class="leg" x="600" y="120" style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13px;fill:var(--text);animation-delay:0.9s">emilio — student, builder</text><text class="leg" x="600" y="144" style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13px;fill:var(--text);animation-delay:1.5s"><tspan style="fill:var(--accent)">$</tspan> ./now</text><text class="leg" x="600" y="168" style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13px;fill:var(--text);animation-delay:2.0s">bots · pipelines · security</text>
<text class="cursor" x="600" y="192" style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:13px;fill:var(--num)">▌</text>
</svg>
